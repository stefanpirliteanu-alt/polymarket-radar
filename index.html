<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Polymarket Sport Radar</title>
<style>
:root{--bg:#0e1a16;--s:#15261f;--tx:#e9f0ea;--mu:#8ea89b;--up:#4fd18b;--dn:#ff6b57;--ac:#e9c46a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Georgia,"Times New Roman",serif}
header{padding:18px 16px 10px;border-bottom:1px solid #2a4237}
h1{margin:0;font-size:22px}
#st{color:var(--mu);font-size:13px;margin-top:2px;font-family:system-ui,sans-serif}
.bar{display:flex;flex-wrap:wrap;gap:10px;padding:10px 16px;font:13px system-ui,sans-serif;color:var(--mu);align-items:center}
.bar label{display:flex;gap:6px;align-items:center}
input,select{background:var(--s);color:var(--tx);border:1px solid #2f4a3e;border-radius:6px;padding:6px 8px;font:inherit;max-width:100%}
input[type=number]{width:64px}input[type=search],input[type=url]{min-width:150px;flex:1}
.chip{border:1px solid #2f4a3e;background:var(--s);color:var(--mu);border-radius:999px;padding:6px 12px;font:13px system-ui,sans-serif;cursor:pointer}
.chip.on{background:var(--ac);color:#10201a;border-color:var(--ac);font-weight:600}
.chip i{font-style:normal;opacity:.7;margin-left:5px}
main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;padding:0 16px 40px}
@media(max-width:860px){main{grid-template-columns:1fr}}
h2{font-size:15px;margin:6px 0 8px;color:var(--ac)}
.ev{background:var(--s);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.ev h3{margin:0 0 2px;font-size:16px}
.meta{font:12px system-ui,sans-serif;color:var(--mu);margin-bottom:6px}
.row{display:grid;grid-template-columns:1fr 54px 78px 84px;gap:8px;align-items:center;padding:5px 0;border-top:1px solid #2a4237;font-family:system-ui,sans-serif;font-size:14px}
.row .p{font-weight:700;text-align:right}
.d{text-align:right;font-weight:600}.up{color:var(--up)}.dn{color:var(--dn)}.fl{color:var(--mu)}
.big{background:#ff6b5722;border-radius:6px;padding:2px 4px}.big.u{background:#4fd18b22}
svg{display:block}
.al{background:var(--s);border-left:3px solid var(--dn);border-radius:6px;padding:8px 10px;margin-bottom:8px;font:13px system-ui,sans-serif}
.al.u{border-color:var(--up)}.al b{display:block;font-size:14px}.al small{color:var(--mu)}
.sticky{position:sticky;top:8px;max-height:92vh;overflow:auto}
.empty{color:var(--mu);font:13px system-ui,sans-serif}
</style>
</head>
<body>
<header>
  <h1>Polymarket Sport Radar</h1>
  <div id="st">Se încarcă…</div>
</header>
<div class="bar" id="chips"></div>
<div class="bar">
  <label>Alertă la ≥ <input id="thr" type="number" min="1" max="50" value="5"> pp</label>
  <label>în ultimele
    <select id="win"><option value="5">5 min</option><option value="15">15 min</option><option value="30" selected>30 min</option><option value="60">1 oră</option><option value="180">3 ore</option></select>
  </label>
  <label>Refresh
    <select id="ref"><option value="15">15 s</option><option value="30" selected>30 s</option><option value="60">60 s</option></select>
  </label>
  <label>Sport <select id="sport"><option value="">Toate</option></select></label>
  <label>Sortare
    <select id="sort"><option value="mov">Cele mai mari mișcări</option><option value="vol">Volum 24h</option></select>
  </label>
  <label><input id="hide" type="checkbox" checked> ascunde ≤2% / ≥98%</label>
  <input id="q" type="search" placeholder="Caută echipă / meci">
  <input id="wk" type="url" placeholder="URL Worker (https://....workers.dev)" style="flex-basis:100%">
</div>
<main>
  <section><div id="list"></div></section>
  <aside><div class="sticky"><h2>Alerte mișcări bruște</h2><div id="alerts"></div></div></aside>
</main>

<script>
const G='https://gamma-api.polymarket.com', C='https://clob.polymarket.com';
const $=id=>document.getElementById(id);
const TYPES=[['ml','Moneyline'],['spread','Handicap'],['total','Total (O/U)'],['btts','Ambele marchează'],['half','Repriză / sfert'],['prop','Prop-uri']];
const S={items:new Map(),hist:new Map(),alerts:[],cool:{},seeded:new Set(),types:new Set(['ml']),timer:null};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arr=v=>{try{return typeof v==='string'?JSON.parse(v):(v||[])}catch{return[]}};
const tname=k=>(TYPES.find(t=>t[0]===k)||[,k])[1];

/* ---------- rețea ---------- */
const ROUTES=[u=>u,u=>'https://corsproxy.io/?url='+encodeURIComponent(u),u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u)];
let route=0;
const W=()=>($('wk').value||'').trim().replace(/\/+$/,'');
async function jget(u,o){
  if(W()){const r=await fetch(u.replace(G,W()+'/gamma').replace(C,W()+'/clob'),o);if(!r.ok)throw new Error(r.status);return r.json()}
  if(o&&o.method==='POST'){
    if(route!==0) throw new Error('POST indisponibil prin proxy');
    const r=await fetch(u,o);if(!r.ok)throw new Error(r.status);return r.json();
  }
  let err;
  for(let k=0;k<ROUTES.length;k++){
    const i=(route+k)%ROUTES.length;
    try{const r=await fetch(ROUTES[i](u));if(!r.ok)throw new Error(r.status);const j=await r.json();route=i;return j}catch(e){err=e}
  }
  throw err;
}

/* ---------- clasificare tip pariu ---------- */
function mtype(m){
  const t=(m.sportsMarketType||'').toLowerCase(),q=((m.question||'')+' '+(m.groupItemTitle||'')).toLowerCase();
  if(t){
    if(/half|quarter|period|inning/.test(t)) return 'half';
    if(t==='moneyline'||t==='child_moneyline') return 'ml';
    if(t.includes('spread')) return 'spread';
    if(t.includes('total')) return 'total';
    if(t.includes('both_teams')||t==='btts') return 'btts';
    return 'prop';
  }
  if(/1st half|first half|2nd half|quarter|1h |2h /.test(q)) return 'half';
  if(/spread|handicap/.test(q)) return 'spread';
  if(/o\/u|over|under|total/.test(q)) return 'total';
  if(/both teams/.test(q)) return 'btts';
  if(/first |exact|score|mvp|player|points|goals|assists|rebounds|yards|strikeouts|touchdown|win by/.test(q)) return 'prop';
  return 'ml';
}

/* ---------- Gamma ---------- */
async function loadGamma(){
  const evs=await jget(`${G}/events?tag_id=1&active=true&closed=false&limit=200&order=volume24hr&ascending=false`);
  const seen=new Set();
  for(const ev of evs){
    const tags=(ev.tags||[]).map(t=>t.label).filter(l=>l&&!/^(sports|games|all)$/i.test(l));
    for(const m of (ev.markets||[])){
      if(m.closed||m.active===false) continue;
      const outs=arr(m.outcomes),prices=arr(m.outcomePrices),toks=arr(m.clobTokenIds);
      if(!toks.length) continue;
      const yn=outs.length===2&&/^yes$/i.test(outs[0]);
      const type=mtype(m),line=m.groupItemTitle||m.question;
      outs.forEach((o,i)=>{
        if(yn&&i===1) return;
        const id=toks[i]; if(!id) return;
        seen.add(id);
        S.items.set(id,{id,ev,m,type,tags,
          label:yn?line:(type==='ml'?o:`${o}: ${line}`),
          p:parseFloat(prices[i]),vol:+m.volume24hr||+ev.volume24hr||0});
      });
    }
  }
  for(const id of [...S.items.keys()]) if(!seen.has(id)) S.items.delete(id);
}
const sel=()=>[...S.items.values()].filter(x=>S.types.has(x.type));

/* ---------- CLOB ---------- */
async function loadMidpoints(){
  if(route!==0&&!W()) return;
  const ids=sel().sort((a,b)=>b.vol-a.vol).slice(0,300).map(x=>x.id);
  for(let i=0;i<ids.length;i+=100){
    try{
      const r=await jget(`${C}/midpoints`,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify(ids.slice(i,i+100).map(token_id=>({token_id})))});
      for(const [id,v] of Object.entries(r)){const it=S.items.get(id),p=parseFloat(v);if(it&&p>=0)it.p=p}
    }catch(e){}
  }
}
async function seedHistory(){
  const top=sel().filter(x=>x.p>0.02&&x.p<0.98&&!S.seeded.has(x.id)).sort((a,b)=>b.vol-a.vol).slice(0,40);
  let k=0;
  await Promise.all(Array.from({length:5},async()=>{
    while(k<top.length){
      const it=top[k++]; S.seeded.add(it.id);
      try{
        const r=await jget(`${C}/prices-history?market=${it.id}&interval=6h&fidelity=5`);
        S.hist.set(it.id,(r.history||[]).map(x=>({t:x.t*1000,p:x.p})));
      }catch(e){}
    }
  }));
}

/* ---------- logică alerte ---------- */
function record(now){
  const keep=now-6*3600e3;
  for(const it of S.items.values()){
    if(!(it.p>=0)) continue;
    const h=S.hist.get(it.id)||[];
    h.push({t:now,p:it.p});
    while(h.length&&h[0].t<keep) h.shift();
    S.hist.set(it.id,h);
  }
}
function delta(id,winMin,now){
  const h=S.hist.get(id); if(!h||h.length<2) return null;
  const ref=h.find(x=>x.t>=now-winMin*60e3)||h[0];
  return (h[h.length-1].p-ref.p)*100;
}
function detect(now){
  const thr=+$('thr').value||5,win=+$('win').value;
  for(const it of sel()){
    const d=delta(it.id,win,now);
    if(d===null||Math.abs(d)<thr) continue;
    if(now-(S.cool[it.id]||0)<win*60e3) continue;
    S.cool[it.id]=now;
    const h=S.hist.get(it.id),ref=h.find(x=>x.t>=now-win*60e3)||h[0];
    S.alerts.unshift({t:now,ev:it.ev.title,label:it.label,type:it.type,from:ref.p*100,to:it.p*100,d});
    S.alerts=S.alerts.slice(0,60);
    try{new Notification(`${d<0?'▼':'▲'} ${it.label} ${d.toFixed(1)} pp`,{body:it.ev.title})}catch(e){}
  }
}

/* ---------- UI ---------- */
function spark(id){
  const h=S.hist.get(id)||[]; if(h.length<2) return '';
  const w=80,ht=22,min=Math.min(...h.map(x=>x.p)),max=Math.max(...h.map(x=>x.p)),r=(max-min)||1;
  const t0=h[0].t,tr=(h[h.length-1].t-t0)||1;
  const pts=h.map(x=>`${((x.t-t0)/tr*w).toFixed(1)},${(ht-2-(x.p-min)/r*(ht-4)).toFixed(1)}`).join(' ');
  return `<svg width="${w}" height="${ht}" viewBox="0 0 ${w} ${ht}"><polyline fill="none" stroke="${h[h.length-1].p>=h[0].p?'#4fd18b':'#ff6b57'}" stroke-width="1.5" points="${pts}"/></svg>`;
}
function renderChips(){
  const cnt={};for(const it of S.items.values()) cnt[it.type]=(cnt[it.type]||0)+1;
  $('chips').innerHTML=TYPES.map(([k,n])=>`<button class="chip ${S.types.has(k)?'on':''}" data-k="${k}">${n}<i>${cnt[k]||0}</i></button>`).join('');
}
function renderSports(){
  const c={};for(const it of S.items.values()) for(const t of it.tags) c[t]=(c[t]||0)+1;
  const cur=$('sport').value,names=Object.keys(c).sort((a,b)=>c[b]-c[a]);
  $('sport').innerHTML='<option value="">Toate</option>'+names.map(n=>`<option ${n===cur?'selected':''} value="${esc(n)}">${esc(n)} (${c[n]})</option>`).join('');
}
function render(){
  const now=Date.now(),win=+$('win').value,thr=+$('thr').value||5;
  const q=$('q').value.trim().toLowerCase(),sort=$('sort').value,sp=$('sport').value,hide=$('hide').checked;
  const groups=new Map();
  for(const it of sel()){
    if(sp&&!it.tags.includes(sp)) continue;
    if(hide&&(it.p<=0.02||it.p>=0.98)) continue;
    if(q&&!(it.ev.title+' '+it.label).toLowerCase().includes(q)) continue;
    const g=groups.get(it.ev.id)||{ev:it.ev,rows:[],mov:0,vol:+it.ev.volume24hr||0};
    it.d=delta(it.id,win,now);
    g.mov=Math.max(g.mov,Math.abs(it.d||0));
    g.rows.push(it); groups.set(it.ev.id,g);
  }
  const gs=[...groups.values()].sort((a,b)=>sort==='mov'?b.mov-a.mov:b.vol-a.vol).slice(0,80);
  $('list').innerHTML=gs.length?gs.map(g=>{
    const dt=g.ev.endDate||g.ev.startDate?new Date(g.ev.endDate||g.ev.startDate).toLocaleString('ro-RO',{dateStyle:'short',timeStyle:'short'}):'';
    const rows=g.rows.sort((a,b)=>Math.abs(b.d||0)-Math.abs(a.d||0)).map(it=>{
      const d=it.d,big=d!==null&&Math.abs(d)>=thr;
      const cls=d===null||Math.abs(d)<0.05?'fl':d>0?'up':'dn';
      return `<div class="row"><span>${esc(it.label)}</span><span class="p">${(it.p*100).toFixed(1)}%</span><span class="d ${cls} ${big?'big '+(d>0?'u':''):''}">${d===null?'–':(d>0?'+':'')+d.toFixed(1)+' pp'}</span>${spark(it.id)}</div>`;
    }).join('');
    return `<div class="ev"><h3>${esc(g.ev.title)}</h3><div class="meta">${esc(dt)} · vol 24h $${Math.round(g.vol).toLocaleString('ro-RO')}</div>${rows}</div>`;
  }).join(''):'<div class="empty">Nimic de afișat cu filtrele curente.</div>';
  $('alerts').innerHTML=S.alerts.length?S.alerts.map(a=>`<div class="al ${a.d>0?'u':''}"><b>${a.d>0?'▲':'▼'} ${esc(a.label)} ${a.d>0?'+':''}${a.d.toFixed(1)} pp</b>${esc(a.ev)}<br><small>${esc(tname(a.type))} · ${a.from.toFixed(1)}% → ${a.to.toFixed(1)}% · ${new Date(a.t).toLocaleTimeString('ro-RO')}</small></div>`).join(''):'<div class="empty">Nicio alertă încă. Pragul se aplică pe fereastra aleasă.</div>';
  document.title=(S.alerts.length?`(${S.alerts.length}) `:'')+'Polymarket Sport Radar';
}

async function tick(){
  clearTimeout(S.timer);
  try{
    $('st').textContent='Actualizez…';
    await loadGamma(); renderChips(); renderSports();
    await loadMidpoints();
    await seedHistory();
    const now=Date.now(); record(now); detect(now); render();
    $('st').textContent=`${sel().length} selecții urmărite · actualizat ${new Date().toLocaleTimeString('ro-RO')} · ${W()?'prin Worker':route===0?'conexiune directă':'prin proxy CORS'}`;
  }catch(e){
    $('st').textContent='Eroare: '+e.message+' — Polymarket blochează accesul direct din browser; completează câmpul URL Worker.';
  }
  S.timer=setTimeout(tick,(+$('ref').value||30)*1000);
}

/* ---------- setări salvate ---------- */
const IDS=['thr','win','ref','sort','hide','wk'];
function save(){try{const c={types:[...S.types]};IDS.forEach(i=>c[i]=$(i).type==='checkbox'?$(i).checked:$(i).value);localStorage.setItem('cfg',JSON.stringify(c))}catch(e){}}
try{const c=JSON.parse(localStorage.getItem('cfg')||'{}');
  if(c.types&&c.types.length) S.types=new Set(c.types);
  IDS.forEach(i=>{if(c[i]!==undefined){if($(i).type==='checkbox')$(i).checked=c[i];else $(i).value=c[i]}})}catch(e){}

$('chips').addEventListener('click',e=>{
  const b=e.target.closest('.chip'); if(!b) return;
  const k=b.dataset.k; S.types.has(k)?S.types.delete(k):S.types.add(k);
  if(!S.types.size) S.types.add('ml');
  save(); renderChips(); render(); tick();
});
['thr','win','hide','sort','sport','q'].forEach(id=>$(id).addEventListener('input',()=>{save();render()}));
$('ref').addEventListener('change',()=>{save();tick()});
$('wk').addEventListener('change',()=>{save();tick()});
try{if('Notification' in window&&Notification.permission==='default')Notification.requestPermission()}catch(e){}
renderChips(); tick();
</script>
</body>
</html>
